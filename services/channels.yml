---
channels:
  name: channels
  description: "Channels DVR - Live TV and DVR"
  image: "fancybits/channels-dvr:latest@sha256:438e362cf739f4d002ecdcc17baee6917ecd22a8d9d4aa044288042c1039d591"
  userns: "keep-id"
  volumes:
    - "{{ mms_config_dir }}/channels:/channels-dvr:Z"
    - "/data/recordings:/shares/DVR"
  publish_ports:
    - "8089:8089"
  environment:
    - "TZ={{ mms_timezone }}"
  health_cmd: "curl -sf http://localhost:8089 || exit 1"
  health_interval: "60s"
  backup_type: "arr"
  backup_db_files: []
