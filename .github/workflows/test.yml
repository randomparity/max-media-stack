---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Gate is converge/idempotence/verify; destroy is best-effort
        # (teardown of privileged systemd containers reaps unreliably).
        role: [base_system, open_notebook, quadlet_service, traefik]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Key is deliberately not matrix-dependent: all four legs install the
      # same requirements.yml and share one cache entry.
      - name: Cache Galaxy collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ansible/collections
          key: ${{ runner.os }}-galaxy-${{ hashFiles('requirements.yml') }}
          restore-keys: |
            ${{ runner.os }}-galaxy-

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule (converge, idempotence, verify)
        working-directory: roles/${{ matrix.role }}
        run: molecule test -s default --destroy=never

      - name: Clean up Molecule instance (best-effort)
        if: always()
        working-directory: roles/${{ matrix.role }}
        continue-on-error: true
        run: molecule destroy -s default
