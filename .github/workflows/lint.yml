---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run zizmor
        run: zizmor --min-severity high .github/workflows/

      - name: Cache Galaxy collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ansible/collections
          key: ${{ runner.os }}-galaxy-${{ hashFiles('requirements.yml') }}
          restore-keys: |
            ${{ runner.os }}-galaxy-

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Create dummy vault password file
        run: echo "dummy" > /tmp/vault_pass_mms

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault_pass_mms

      - name: Run ansible-lint
        run: ansible-lint playbooks/ roles/
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault_pass_mms

      - name: Run syntax check on all playbooks
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault_pass_mms
